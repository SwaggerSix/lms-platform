name: Upload Mosaic course files

# One click: puts the Mosaic course player (scorm-packages/mosaic-player/
# player.js) into all five certification packages, and any edited file under
# scorm-packages/live/<package id>/ into its package, in Supabase storage.
# The files it replaces are kept as this run's "previous-course-files"
# artifact. See scorm-packages/live/README.md.
#
# Setup (once): add the SUPABASE_SERVICE_ROLE_KEY repository secret: a secret
# key (Supabase dashboard → Project Settings → API Keys → "Publishable and
# secret API keys" → Secret keys, sb_secret_...) or the legacy service_role key
# ("Legacy API keys" tab). Either works.

on:
  workflow_dispatch: {}

concurrency:
  group: upload-mosaic-course-files
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Upload
        env:
          SUPABASE_URL: https://aexpaugbycnaxbiyidmo.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bash scripts/upload-mosaic-course-files.sh

      - name: Keep the files that were replaced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: previous-course-files
          path: previous/
          retention-days: 90
          if-no-files-found: ignore
